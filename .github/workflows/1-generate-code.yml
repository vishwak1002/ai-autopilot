name: 🤖 1 — Generate Code

on:
  schedule:
    - cron: "0 */4 * * *"   # Every 4 hours
  workflow_dispatch:         # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ai-autopilot (engine)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read registered target repos
        id: targets
        run: |
          TARGETS=$(python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from utils import get_registered_targets
          targets = get_registered_targets()
          print(",".join(targets))
          EOF
          )
          echo "repos=$TARGETS" >> $GITHUB_OUTPUT
          echo "Found targets: $TARGETS"

      - name: Process each target repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'anthropic' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-opus-4-5' }}
        run: |
          IFS=',' read -ra REPOS <<< "${{ steps.targets.outputs.repos }}"

          for REPO in "${REPOS[@]}"; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Processing target: $REPO"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            REPO_DIR="/tmp/target-$(echo $REPO | tr '/' '-')"
            gh repo clone "$REPO" "$REPO_DIR" -- --depth=1

            # Generate code
            TARGET_REPO_PATH="$REPO_DIR" python scripts/generate.py

            FEATURE_NAME=$(grep "^feature_name=" $GITHUB_OUTPUT | tail -1 | cut -d'=' -f2)
            DESCRIPTION=$(grep "^description=" $GITHUB_OUTPUT | tail -1 | cut -d'=' -f2)
            PROMPT=$(grep "^prompt=" $GITHUB_OUTPUT | tail -1 | cut -d'=' -f2)
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BRANCH="ai-gen/${FEATURE_NAME}-${TIMESTAMP}"

            # Commit and push to target repo
            cd "$REPO_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"

            # Stage generated files + updated FEEDBACK.md
            git add generated/ FEEDBACK.md 2>/dev/null || git add generated/
            git commit -m "🤖 AI Generated: $FEATURE_NAME

Prompt: $PROMPT

$DESCRIPTION

Generated by ai-autopilot"

            git push origin "$BRANCH"

            # Open PR in target repo
            gh pr create \
              --repo "$REPO" \
              --title "🤖 AI Generated: $FEATURE_NAME" \
              --body "## 🤖 Autopilot — Auto-Generated Feature

**Prompt Used:** $PROMPT

**Description:** $DESCRIPTION

---
*Generated by [ai-autopilot](https://github.com/${{ github.repository }})*
*An AI code review will be posted automatically.*" \
              --head "$BRANCH" \
              --base main \
              --label "autopilot" || true

            cd -
            echo "Done with $REPO"
          done
