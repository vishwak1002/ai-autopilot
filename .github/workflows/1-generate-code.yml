name: 🤖 1 — Generate Code

on:
  schedule:
    - cron: "0 */4 * * *"   # Every 4 hours
  workflow_dispatch:         # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Job 1: Read target repos and build the matrix ──────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout ai-autopilot (engine)
        uses: actions/checkout@v4

      - name: Build matrix from registered target repos
        id: build-matrix
        run: |
          python3 - << 'EOF'
          import re, json, pathlib, os

          content = pathlib.Path("README.md").read_text()
          section = re.search(r"## 🎯 Target Repos(.*?)(?=##|\Z)", content, re.DOTALL)
          repos = re.findall(r"^[-*]\s+(\S+/\S+)$", section.group(1), re.MULTILINE) if section else []

          matrix = json.dumps({"repo": repos})
          print(f"Matrix: {matrix}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          EOF

  # ── Job 2: One parallel job per target repo (matrix) ───────────────────────
  generate:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      fail-fast: false   # Don't cancel other repos if one fails
    name: Generate → ${{ matrix.repo }}
    steps:
      - name: Checkout ai-autopilot (engine)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clone target repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          REPO_DIR="/tmp/target-repo"
          gh repo clone "${{ matrix.repo }}" "$REPO_DIR" -- --depth=1
          echo "REPO_DIR=$REPO_DIR" >> $GITHUB_ENV

      - name: Generate code from prompts
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'anthropic' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-opus-4-5' }}
          TARGET_REPO_PATH: /tmp/target-repo
        run: python scripts/generate.py

      - name: Push branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          FEATURE_NAME="${{ steps.generate.outputs.feature_name }}"
          DESCRIPTION="${{ steps.generate.outputs.description }}"
          PROMPT="${{ steps.generate.outputs.prompt }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="ai-gen/${FEATURE_NAME}-${TIMESTAMP}"

          cd "$REPO_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add generated/ FEEDBACK.md 2>/dev/null || git add generated/
          git commit -m "🤖 AI Generated: $FEATURE_NAME

Prompt: $PROMPT

$DESCRIPTION

Generated by ai-autopilot"

          git push origin "$BRANCH"

          gh pr create \
            --repo "${{ matrix.repo }}" \
            --title "🤖 AI Generated: $FEATURE_NAME" \
            --body "## 🤖 Autopilot — Auto-Generated Feature

**Prompt Used:** $PROMPT

**Description:** $DESCRIPTION

---
*Generated by [ai-autopilot](https://github.com/${{ github.repository }})*
*An AI code review will be posted automatically.*" \
            --head "$BRANCH" \
            --base main \
            --label "autopilot" || true

      - name: Summary
        run: |
          echo "### ✅ ${{ matrix.repo }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Feature:** ${{ steps.generate.outputs.feature_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Description:** ${{ steps.generate.outputs.description }}" >> $GITHUB_STEP_SUMMARY
