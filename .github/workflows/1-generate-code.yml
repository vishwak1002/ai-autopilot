name: 🤖 1 — Generate Code

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Job 1: Build matrix ───────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout ai-autopilot (engine)
        uses: actions/checkout@v4

      - name: Build matrix from README
        id: build-matrix
        run: |
          python3 - << 'EOF'
          import re, json, pathlib, os

          content = pathlib.Path("README.md").read_text()
          section = re.search(r"## 🎯 Target Repos(.*?)(?=##|\Z)", content, re.DOTALL)

          repos = []
          if section:
              repos = re.findall(r"^[-*]\s+(\S+/\S+)$", section.group(1), re.MULTILINE)

          # Ensure matrix is NEVER empty (GitHub crashes otherwise)
          if not repos:
              repos = ["dummy/dummy"]

          matrix = json.dumps({"repo": repos})

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          EOF

  # ── Job 2: Generate per repo ──────────────────────────────────────────────
  generate:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.matrix != '' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      fail-fast: false

    name: Generate → ${{ matrix.repo }}

    steps:
      - name: Checkout ai-autopilot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      - name: Clone target repo
        run: |
          set -e
          REPO_DIR="/tmp/target-repo"
          gh repo clone "${{ matrix.repo }}" "$REPO_DIR" -- --depth=1
          echo "TARGET_REPO_PATH=$REPO_DIR" >> $GITHUB_ENV

      - name: Generate code from prompts
        id: generate
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openrouter' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'tencent/hy3-preview:free' }}
          TARGET_REPO_PATH: ${{ env.TARGET_REPO_PATH }}
        run: |
          set -e
          python scripts/generate.py

      - name: Push branch and open PR
        if: ${{ steps.generate.outputs.feature_name != '' }}
        run: |
          set -e

          FEATURE_NAME="${{ steps.generate.outputs.feature_name }}"
          DESCRIPTION="${{ steps.generate.outputs.description }}"
          PROMPT="${{ steps.generate.outputs.prompt }}"

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="ai-gen/${FEATURE_NAME}-${TIMESTAMP}"

          cd "$TARGET_REPO_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          git add generated/ FEEDBACK.md 2>/dev/null || git add generated/

          cat <<EOF > /tmp/commit_msg.txt
🤖 AI Generated: $FEATURE_NAME

Prompt: $PROMPT

$DESCRIPTION

Generated by ai-autopilot
EOF

          git commit -F /tmp/commit_msg.txt || echo "Nothing to commit"
          git push origin "$BRANCH"

          gh pr create \
            --repo "${{ matrix.repo }}" \
            --title "🤖 AI Generated: $FEATURE_NAME" \
            --body "## 🤖 Autopilot — Auto-Generated Feature

**Prompt Used:** $PROMPT

**Description:** $DESCRIPTION

---
Generated by ai-autopilot" \
            --head "$BRANCH" \
            --base main \
            --label "autopilot" || true

      - name: Summary
        run: |
          echo "### ✅ ${{ matrix.repo }}" >> $GITHUB_STEP_SUMMARY
          echo "- Feature: ${{ steps.generate.outputs.feature_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Description: ${{ steps.generate.outputs.description }}" >> $GITHUB_STEP_SUMMARY
